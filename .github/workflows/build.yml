name: Build and publish the image

# Pushes the image to ghcr.io and posts to Zulip. Started by hand, Zulip can be turned off (input), on a pushed tag it
# is on.

on:
  workflow_dispatch:
    inputs:
      zulip:
        description: "Post to Zulip"
        type: boolean
        default: true
  push:
    tags:
      - "*"

env:
  ZULIP: ${{ github.event_name != 'workflow_dispatch' || inputs.zulip }}

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the Docker image for arm and amd
      - name: Build
        run: |-
          GHCR_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "GHCR_IMAGE=$GHCR_IMAGE" >> "$GITHUB_ENV"
          TAGS=(--tag "$GHCR_IMAGE:$GITHUB_REF_NAME")
          # Also the version of the image and the tag of its latest build (see .github/scripts/version.sh)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            mapfile -t VERSION_TAGS < <(.github/scripts/version.sh --tags)
            for TAG in "${VERSION_TAGS[@]}"; do
              [ "$TAG" = "$GITHUB_REF_NAME" ] || TAGS+=(--tag "$GHCR_IMAGE:$TAG")
            done
          fi
          docker buildx build \
            "${TAGS[@]}" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --build-arg GITHUB_SHA="$GITHUB_SHA" \
            --build-arg GITHUB_REF="$GITHUB_REF" \
            --push \
            --platform=linux/arm64,linux/amd64 \
            -f ./Dockerfile \
            .

      - name: Send a stream message to Zulip
        if: env.ZULIP == 'true'
        uses: zulip/github-actions-zulip/send-message@v1
        with:
          api-key: ${{ secrets.ZULIPAPIKEY }}
          email: "ahdis-bot@chat.fhir.org"
          organization-url: "https://chat.fhir.org"
          to: "matchbox"
          type: "stream"
          topic: "new matchbox-ch-elm version published"
          content: |
              :rocket: ${{ github.repository }}:${{ github.ref_name }} published :rocket:

              see also https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}

              docker pull ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}

      - name: Send a stream message to Zulip
        if: failure() && env.ZULIP == 'true'
        uses: zulip/github-actions-zulip/send-message@v1
        with:
          api-key: ${{ secrets.ZULIPAPIKEY }}
          email: "ahdis-bot@chat.fhir.org"
          organization-url: "https://chat.fhir.org"
          to: "ahdis"
          type: "stream"
          topic: "failed publishing for matchbox-ch-elm"
          content: |
              failure ${{ github.repository }}:${{ github.ref_name }}

              see https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
