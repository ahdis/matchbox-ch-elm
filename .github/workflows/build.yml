name: Build and publish the image

# Pushes the image to ghcr.io and posts to Zulip. Started by hand, Zulip can be turned off (input), on a pushed tag it
# is on.
# The image is built with Docker's reusable workflow, one native runner per platform:
# https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners

on:
  workflow_dispatch:
    inputs:
      zulip:
        description: "Post to Zulip"
        type: boolean
        default: true
  push:
    tags:
      - "*"

jobs:
  tags:
    name: Compute the tags
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      image: ${{ steps.tags.outputs.image }}
      tags: ${{ steps.tags.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The ref name, on a tag also the version of the image and the tag of its latest build (see
      # .github/scripts/version.sh)
      - name: Compute the tags
        id: tags
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          TAGS=("type=ref,event=branch" "type=ref,event=tag")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION_TAGS=$(.github/scripts/version.sh --tags)
            for TAG in $VERSION_TAGS; do
              [ "$TAG" = "$GITHUB_REF_NAME" ] || TAGS+=("type=raw,value=$TAG")
            done
          fi
          printf 'tags<<EOF\n%s\nEOF\n' "$(printf '%s\n' "${TAGS[@]}")" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: tags
    uses: docker/github-builder/.github/workflows/build.yml@cbc9d42f8c89a55623392aadd03600965b80e963 # v1.18.1

    permissions:
      contents: read
      packages: write
      id-token: write

    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      build-args: |
        GITHUB_SHA=${{ github.sha }}
        GITHUB_REF=${{ github.ref }}
      meta-images: ${{ needs.tags.outputs.image }}
      meta-tags: ${{ needs.tags.outputs.tags }}
      meta-flavor: latest=false

    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # The reusable workflow pushes the tags with the image, including the moving tag of the latest build, so this scan
  # doesn't stop the publication. The gate for releases is the scan in release.yml, this one covers builds started by
  # hand or by a pushed tag. A finding fails the run and the image isn't announced on Zulip.
  scan:
    name: Scan the image with Trivy
    needs: [tags, build]
    runs-on: ubuntu-latest

    permissions:
      packages: read

    steps:
      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner in image mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.76.0'
          scan-type: 'image'
          image-ref: ${{ needs.tags.outputs.image }}@${{ needs.build.outputs.digest }}
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-db:1

  zulip:
    name: Post to Zulip
    needs: [tags, build, scan]
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.zulip) }}
    runs-on: ubuntu-latest
    environment: production

    permissions: {}

    steps:
      - name: Send a stream message to Zulip
        if: needs.build.result == 'success' && needs.scan.result == 'success'
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIPAPIKEY }}
          email: "ahdis-bot@chat.fhir.org"
          organization-url: "https://chat.fhir.org"
          to: "matchbox"
          type: "stream"
          topic: "new matchbox-ch-elm version published"
          content: |
              :rocket: ${{ github.repository }}:${{ github.ref_name }} published :rocket:

              see also https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}

              docker pull ${{ needs.tags.outputs.image }}:${{ github.ref_name }}

      - name: Send a stream message to Zulip
        if: needs.build.result != 'success'
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIPAPIKEY }}
          email: "ahdis-bot@chat.fhir.org"
          organization-url: "https://chat.fhir.org"
          to: "ahdis"
          type: "stream"
          topic: "failed publishing for matchbox-ch-elm"
          content: |
              failure ${{ github.repository }}:${{ github.ref_name }}

              see https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
