name: Security checks

# Scans the Matchbox image of the Dockerfile on push, pull request and daily, and the image of the last release on
# ghcr.io daily and when started by hand. The findings go to the Security tab. A finding in the image of the last release
# fails the run and is posted to Zulip, like a failure of that scan.

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 8 * * *' # Every day at 8h00

jobs:
  test-trivy:
    name: Analyze the Matchbox image with Trivy
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      # We will scan the Matchbox image used in the Dockerfile with Trivy.
      # The Trivy scan is also enabled in Matchbox repository, but only for the latest version.
      # If a new vulnerability is discovered in a previous release that is still used here, we will catch it.

      - name: Extract the image name from the Dockerfile
        run: echo "image_name=$(awk '/FROM ([a-zA-Z0-9\.\-/:]+)/ { print $2 }' Dockerfile)" >> "$GITHUB_ENV"

      - name: Run Trivy vulnerability scanner in image mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.76.0'
          scan-type: 'image'
          image-ref: ${{ env.image_name }}
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-db:1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIONS_RUNTIME_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Catches advisories published after the release
  scan-release:
    name: Analyze the released image with Trivy
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    outputs:
      image: ${{ steps.release.outputs.image }}
      findings: ${{ steps.findings.outputs.findings }}

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      # The first entry of the changelog, .github/scripts/version.sh doesn't know the revision of a rebuild (-r2)
      - name: Get the image of the last release
        id: release
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:$(awk 'NF { print $1; exit }' changelog.md)" >> "$GITHUB_OUTPUT"

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner in image mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.76.0'
          scan-type: 'image'
          image-ref: ${{ steps.release.outputs.image }}
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          exit-code: '1'
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-db:1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIONS_RUNTIME_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: List the findings
        id: findings
        if: always()
        run: |
          FINDINGS=$(jq -r '[.runs[].results[].ruleId] | unique | join(" ")' trivy-results.sarif || true)
          echo "findings=$FINDINGS" >> "$GITHUB_OUTPUT"

  zulip:
    name: Post to Zulip
    needs: scan-release
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    environment: production

    permissions: {}

    steps:
      - name: Send a stream message to Zulip
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIPAPIKEY }}
          email: "ahdis-bot@chat.fhir.org"
          organization-url: "https://chat.fhir.org"
          to: "ahdis"
          type: "stream"
          topic: "matchbox-ch-elm image scan"
          content: |
              ${{ needs.scan-release.outputs.findings != '' && format('HIGH or CRITICAL vulnerabilities with a fix in {0}: {1}', needs.scan-release.outputs.image, needs.scan-release.outputs.findings) || 'the scan of the last release failed, without a list of findings' }}

              see https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
