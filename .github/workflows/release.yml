name: Create a release

# Makes a release from main, named after its versions: <ch-elm>-<matchbox> (e.g. 1.15.1-4.1.22), for a rebuild of the
# same versions -r2, -r3, ... (see .github/scripts/prepare-release.sh).
# It updates the files to the new matchbox and/or ch-elm version, adds the changelog entry, checks that the image builds
# and pushes the release commit to main. Then it creates the tag and the GitHub release with the notes from
# changelog.md and starts the Docker image workflow on the new tag.
# A tag created with the GITHUB_TOKEN doesn't trigger the 'push: tags' workflows, so it's dispatched explicitly.

on:
  workflow_dispatch:
    inputs:
      matchbox:
        description: "New matchbox version (e.g. v4.1.22). Empty: unchanged"
        type: string
      chelm:
        description: "New ch-elm version (e.g. 1.16.0) or 'cibuild'. Empty: unchanged"
        type: string
      note:
        description: "Additional line for the changelog entry, required for a rebuild of the same versions"
        type: string
      zulip:
        description: "Post the image to Zulip"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency: release

jobs:
  release:
    name: Create the release
    runs-on: ubuntu-latest

    steps:
      - name: Check the branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main, not $GITHUB_REF_NAME"
          exit 1

      - name: Checkout the repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Update the versions
        id: prepare
        env:
          MATCHBOX: ${{ inputs.matchbox }}
          CHELM: ${{ inputs.chelm }}
          NOTE: ${{ inputs.note }}
        run: |
          VERSION=$(.github/scripts/prepare-release.sh "$MATCHBOX" "$CHELM" "$NOTE")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git diff
          if git diff --quiet; then
            echo "commit=false" >> "$GITHUB_OUTPUT"
          else
            echo "commit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the release
        run: |
          # The changelog entry must match the matchbox image and the ch-elm package that get built
          MATCHBOX=$(sed -n 's/^FROM .*matchbox:\(v[^ ]*\).*/\1/p' Dockerfile)
          CHELM=$(tar -xOzf src/ch.fhir.ig.ch-elm.tgz package/package.json | jq -r .version)
          ENTRY=$(awk 'NF == 0 { exit } { print }' changelog.md)
          if ! grep -qx -- "- matchbox $MATCHBOX" <<< "$ENTRY"; then
            echo "::error::The changelog entry doesn't list '- matchbox $MATCHBOX' (Dockerfile)"
            exit 1
          fi
          if ! grep -qx -- "- ch.fhir.ig.ch-elm#$CHELM" <<< "$ENTRY"; then
            echo "::error::The changelog entry doesn't list '- ch.fhir.ig.ch-elm#$CHELM' (src/ch.fhir.ig.ch-elm.tgz)"
            exit 1
          fi
          CONFIGURED=$(yq '.hapi.fhir.implementationguides.chelm.version + " " + .matchbox.fhir.context.igsPreloaded' \
            src/application.yaml)
          if [ "$CONFIGURED" != "$CHELM ch.fhir.ig.ch-elm#$CHELM" ]; then
            echo "::error::src/application.yaml doesn't install and preload ch-elm $CHELM (src/ch.fhir.ig.ch-elm.tgz)"
            exit 1
          fi

      # The image build installs the IG, so this checks that matchbox loads the package before anything is published
      - name: Build the image
        if: steps.prepare.outputs.commit == 'true'
        run: docker build --progress=plain -t matchbox-ch-elm .

      - name: Commit and push to main
        if: steps.prepare.outputs.commit == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile changelog.md README.md src/application.yaml src/ch.fhir.ig.ch-elm.tgz
          git commit -m "$VERSION"
          git push origin HEAD:main

      - name: Extract the release notes from the changelog
        run: |
          # The entry is the lines after '<version> YYYY/MM/DD' up to the next empty line
          awk 'NR > 1 && NF == 0 { exit } NR > 1 { print }' changelog.md > release-notes.md
          {
            printf '\n```\ndocker pull ghcr.io/%s:%s\n' "${GITHUB_REPOSITORY,,}" "$VERSION"
            printf '```\n'
          } >> release-notes.md
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD 2> /dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$VERSION" >> release-notes.md
          fi
          cat release-notes.md

      - name: Create the tag and the release
        env:
          PRERELEASE: ${{ steps.prepare.outputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=()
          if [ "$PRERELEASE" = true ]; then
            PRERELEASE_FLAG=(--prerelease)
          fi
          gh release create "$VERSION" \
            --target "$(git rev-parse HEAD)" \
            --title "Release $VERSION" \
            --notes-file release-notes.md \
            "${PRERELEASE_FLAG[@]}"

      - name: Start the Docker workflow
        env:
          ZULIP: ${{ inputs.zulip }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml --ref "$VERSION" -f zulip="$ZULIP"
